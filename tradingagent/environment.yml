# Prepared only. The user creates this Conda environment and installs dependencies.
# No editable project installation until application code exists.
name: tradingagent
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - "pydantic>=2.10,<3"
      - "pydantic-settings>=2.6,<3"
      - "httpx>=0.28,<1"
      - "websockets>=16.1,<17"
      - "fastapi>=0.115,<1"
      - "uvicorn>=0.30,<1"
      - "jinja2>=3.1,<4"
      - "PyYAML>=6,<7"
      - "keyring>=25,<27"
      - "tzdata>=2024"
      - "pytest>=8,<10"
      - "pytest-asyncio>=0.24,<2"
      - "ruff>=0.8,<1"
