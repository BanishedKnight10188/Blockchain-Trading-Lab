[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-agent-platform"
version = "0.1.0"
description = "Advisory-first Binance BTC agent kernel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.scripts]
btc-agent = "agent_platform.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]
market = ["httpx>=0.28,<1", "websockets>=16.1,<17"]
models = ["httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["agent_platform*"]

[tool.setuptools.package-data]
"agent_platform.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
